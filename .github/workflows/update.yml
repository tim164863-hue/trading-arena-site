name: update-and-deploy
# loop job: one long run (~5h45m) that refreshes the site every 6 min, then dispatches its successor.
# watchdog job (cron): restarts the loop only if no loop run is active/queued. Cron lateness no longer matters.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why (manual / chain / watchdog)"
        required: false
        default: manual
permissions:
  contents: write
  actions: write
jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start loop if none active
        run: |
          active=$(gh run list --workflow update.yml --event workflow_dispatch --limit 20 \
            --json databaseId,status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
          echo "active loop runs: $active"
          if [ "$active" = "0" ]; then gh workflow run update.yml --ref main -f reason=watchdog; echo "dispatched new loop"; fi
  loop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: arena-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update loop
        env:
          GH_TOKEN: ${{ github.token }}
          OKX_API_KEY_1: ${{ secrets.OKX_API_KEY_1 }}
          OKX_SECRET_1: ${{ secrets.OKX_SECRET_1 }}
          OKX_PASSPHRASE_1: ${{ secrets.OKX_PASSPHRASE_1 }}
          OKX_API_KEY_2: ${{ secrets.OKX_API_KEY_2 }}
          OKX_SECRET_2: ${{ secrets.OKX_SECRET_2 }}
          OKX_PASSPHRASE_2: ${{ secrets.OKX_PASSPHRASE_2 }}
          LOOP_SECONDS: "0"
        run: bash .github/loop.sh
