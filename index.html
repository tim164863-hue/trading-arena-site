<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRADING ARENA // 交易競技場</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--c:#00f0ff;--m:#ff2bd6;--y:#fcee0a;--g:#39ff88;--r:#ff3860;--bg:#07050f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a0830 0%,var(--bg) 60%);color:#d8f6ff;font-family:'Share Tech Mono','Noto Sans TC',monospace;font-size:11px}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,43,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);background-size:32px 32px;z-index:-1}
.wrap{max-width:1100px;margin:auto;padding:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
h1{font-family:Orbitron;font-weight:900;font-size:clamp(18px,5.5vw,40px);letter-spacing:2px;margin:0;color:#fff;text-shadow:0 0 6px var(--c),0 0 18px var(--c)}
.clock{font-family:Orbitron;color:var(--y);border:1px solid var(--y);padding:2px 6px;font-size:clamp(9px,2.4vw,13px);text-shadow:0 0 6px var(--y);text-align:right}
.sub{color:var(--m);text-shadow:0 0 6px var(--m);margin:4px 0 2px;font-size:clamp(9.5px,2.6vw,13px)}
.meta{color:#7a8aa8;font-size:9.5px;margin-bottom:5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{--k:var(--c);padding:6px 7px;border:1px solid var(--k);background:linear-gradient(135deg,rgba(0,240,255,.09),rgba(10,8,24,.92) 45%);box-shadow:inset 0 0 14px rgba(0,240,255,.15);min-width:0}
.card.t2{--k:var(--m);background:linear-gradient(135deg,rgba(255,43,214,.1),rgba(10,8,24,.92) 45%);box-shadow:inset 0 0 14px rgba(255,43,214,.15)}
.card h2{margin:0;font-size:13px;color:var(--k);text-shadow:0 0 8px var(--k);display:flex;justify-content:space-between}
.card h2 small{color:#667;font-size:9px;font-weight:400}
.big{font-family:Orbitron;font-size:clamp(18px,5.6vw,30px);font-weight:900;color:#fff;text-shadow:0 0 10px var(--k);margin:2px 0}
.big small{font-size:9px;font-family:'Share Tech Mono'}
.row{display:flex;justify-content:space-between;gap:4px;border-bottom:1px dashed #1c2236;padding:1.5px 0;color:#9ab}
.row>*:last-child{text-align:right;white-space:nowrap}
.pp{border-bottom:1px dashed #1c2236;padding:1.5px 0;color:#cde;line-height:1.25}
.pp .l{display:flex;justify-content:space-between}
.pp .s{color:#789;font-size:9.5px}
.pos{color:var(--g)}.neg{color:var(--r)}
.pt{color:var(--y);font-size:9.5px;margin-top:3px}
.panel{margin-top:6px;padding:5px 6px;border:1px solid var(--y);background:rgba(10,8,24,.88)}
.panel h3{margin:0 0 3px;font-size:10.5px;color:var(--y);letter-spacing:1px}
.cw{position:relative;height:clamp(120px,22vh,260px)}
table{width:100%;border-collapse:collapse;font-size:9.5px;table-layout:fixed}
th{color:var(--c);text-align:left;padding:2px;border-bottom:1px solid var(--c);font-weight:400}
td{padding:2px;border-bottom:1px solid #161d30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#0b0e17;border-radius:8px}
.tt{table-layout:auto;font-size:12px;min-width:640px}
.tt th{font-family:inherit;letter-spacing:1px;font-size:10px;padding:8px 6px;border-bottom:1px solid var(--c);white-space:nowrap}
.tt td{padding:9px 6px;color:#dfe7f2;white-space:nowrap;overflow:visible;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.tt td.mk{white-space:normal;max-width:120px;word-break:break-all}
.tt td.dt small{display:block;color:#678;font-size:9px}
.tt td.pos{color:#3dff8a;text-shadow:0 0 6px #3dff8a88}.tt td.neg{color:#ff4d6d;text-shadow:0 0 6px #ff4d6d88}
.badge{background:var(--y);color:#000;padding:0 4px;font-size:9px}
@media(min-width:800px){body{font-size:13px}.card{padding:12px}.card h2{font-size:18px}table{font-size:12px}.panel h3{font-size:13px}.meta{font-size:11px}}
</style></head><body><div class="wrap">
<div class="top"><h1>TRADING ARENA</h1><span class="clock" id="clk">--</span></div>
<span id="badge" style="display:none"></span>
<div class="meta" id="meta">// 連線中...</div>
<div class="cards" id="cards"></div>
<div class="panel"><h3>資產變化 // EQUITY</h3><div class="cw"><canvas id="eqc"></canvas></div></div>
<div class="panel" style="border-color:var(--c)"><h3 style="color:var(--c)">最近成交 // TRADES</h3><div class="tw"><table class="tt"><thead><tr><th>TIME（台灣）</th><th>TRADER</th><th>MARKET</th><th>SIDE</th><th>PRICE</th><th>QTY</th><th>PNL</th><th>NOTE</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div><script>
const TZ='Asia/Taipei',col={"交易員-1":"#00f0ff","交易員-2":"#ff2bd6"};let chart;
const tick=()=>clk.textContent=new Date().toLocaleString('zh-TW',{timeZone:TZ,hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' 台灣';tick();setInterval(tick,1000);
const f=(v,n=2)=>(+v).toFixed(n),sg=v=>(v>=0?'+':'')+v,px=v=>+(+v).toPrecision(6),cls=v=>+v>=0?'pos':'neg';
async function load(){
 let d,H;
 try{
  const g=async u=>{const r=await fetch(u+'?'+Date.now(),{cache:'no-store',headers:{'ngrok-skip-browser-warning':'1'}});if(!r.ok)throw new Error(r.status);return r.json()};
  [d,H]=await Promise.all([g('data.json'),g('history.json')]);
 }catch(e){netFail();return}
 netOk();
 const allOff=Object.values(d.traders).every(t=>t.status!='live');badge.innerHTML=allOff?'<span class="badge">等待開賽</span>':'';
 meta.textContent='// 更新 '+new Date(d.updated).toLocaleTimeString('zh-TW',{timeZone:TZ,hour12:false})+' 台灣 ・ 每 30 秒自動刷新'+(d.errors&&d.errors.length?' ・ ⚠ '+d.errors.join('; '):'');
 const today=new Date().toLocaleDateString('sv',{timeZone:TZ});let h='',k=0;
 for(const[n,t]of Object.entries(d.traders)){k++;const ts=d.trades.filter(x=>x.trader==n);
  if(t.status=='offline'||t.status=='error'){h+=`<div class="card t${k}"><h2>${n}<small>${t.status=='error'?'連線錯誤':'未連線'}</small></h2><div class="big" style="opacity:.5">--</div></div>`;continue}
  const eq=t.equity??t.start,p=eq-t.start,hr=ts.filter(x=>Date.now()-new Date(x.time.replace(' ','T')+'+08:00')<3600e3).length,dc=ts.filter(x=>x.time.slice(0,10)==today).length,P=t.positions||[];
  h+=`<div class="card t${k}"><h2>${n}<small>起始 ${t.start}U</small></h2>
  <div class="big">${f(eq)} <small>USDT</small></div>
  <div class="row"><span>報酬率</span><b class="${cls(p)}">${sg(f(p/t.start*100))}%</b></div>
  <div class="row"><span>總筆數</span><span>${t.fills_total??ts.length}</span></div>
  <div class="pt">▸ 持倉 (${P.length})</div>
  ${P.map(o=>`<div class="pp"><div class="l"><span>${o.inst.replace('-USDT-SWAP','')} <span class="${o.side=='long'?'pos':'neg'}">${o.side=='long'?'多':'空'}</span></span><b class="${cls(o.upl)}">${sg(f(o.upl))}</b></div><div class="s">${+o.sz}張 @${px(o.avgPx)}</div></div>`).join('')||'<div class="pp s">— 無持倉 —</div>'}
  <div class="row"><span>累計手續費</span><span class="neg">${f(-Math.abs(+(t.fees_total??0)),3)}</span></div>
  <div class="row"><span>累計資金費</span><span class="${cls(t.funding_total??0)}">${t.funding_total!=null?f(t.funding_total,3):'—'}</span></div>
  <div class="row"><span>今日筆數</span><span>${dc}</span></div><div class="row"><span>近1小時</span><span>${hr}</span></div></div>`}
 cards.innerHTML=h;
 const R=d.trades.slice().reverse();
 rows.innerHTML=R.length?R.map(x=>`<tr><td class="dt"><small>${x.time.slice(5,10)}</small>${x.time.slice(11,19)}</td><td>${x.trader.replace('-','')}</td><td class="mk">${x.market}</td><td>${x.side}</td><td>${x.price}</td><td>${x.qty}</td><td class="${cls(x.pnl)}">${(+x.pnl).toFixed(4).replace(/^-?0\.0000$/,'0.0000')}</td><td style="color:#aab">手續費 ${+(x.fee??0).toPrecision(6)}</td></tr>`).join(''):'<tr><td colspan=8 style="text-align:center;color:#789">尚無成交</td></tr>';
 const start=Object.values(d.traders)[0]?.start||50;
 const ds=Object.entries(H).map(([n,p])=>({label:n,data:p.map(([x,y])=>({x,y})),borderColor:col[n],backgroundColor:col[n]+'22',fill:true,tension:.3,pointRadius:0,borderWidth:1.5}));
 ds.push({label:'起始',data:ds.length&&ds[0].data.length?[{x:ds[0].data[0].x,y:start},{x:Date.now(),y:start}]:[],borderColor:'#fcee0a88',borderDash:[4,4],pointRadius:0,borderWidth:1,fill:false});
 if(chart){chart.data.datasets=ds;chart.update('none');return}
 chart=new Chart(eqc,{type:'line',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false,interaction:{mode:'nearest',intersect:false},events:['mousemove','mouseout','touchstart','touchmove'],scales:{x:{type:'linear',ticks:{color:'#9ab',font:{size:9},maxTicksLimit:6,callback:v=>new Date(v).toLocaleTimeString('zh-TW',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false})},grid:{color:'#1a1f33'}},y:{ticks:{color:'#9ab',font:{size:9},maxTicksLimit:5},grid:{color:'#1a1f33'}}},plugins:{legend:{labels:{color:'#d8f6ff',boxWidth:10,font:{size:9}}},tooltip:{callbacks:{title:()=>''}}}}});
}
let retryT=null;
let tipOn=false;
function hideTip(){if(chart){chart.setActiveElements([]);chart.tooltip.setActiveElements([],{x:0,y:0});chart.update('none')}tipOn=false}
document.addEventListener('click',e=>{const c=document.getElementById('eqc');if(!chart||!c)return;if(e.target!==c){hideTip();return}if(tipOn){hideTip()}else{tipOn=true}},true);
const rc=document.createElement('div');rc.id='reconn';rc.textContent='重新連線中…';
rc.style.cssText='position:fixed;right:8px;bottom:8px;z-index:99;padding:3px 8px;font-size:11px;border-radius:4px;background:#0a0d18cc;color:#fcee0a;border:1px solid #fcee0a55;display:none;pointer-events:none';
document.body.appendChild(rc);
function netFail(){rc.style.display='block';clearTimeout(retryT);retryT=setTimeout(safeLoad,5000)}
function netOk(){rc.style.display='none';clearTimeout(retryT);retryT=null}
async function safeLoad(){try{await load()}catch(e){netFail()}}
safeLoad();setInterval(()=>{if(!retryT)safeLoad()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)safeLoad()});
window.addEventListener('online',safeLoad);
</script></body></html>
